{% extends "base.html" %}

{% block body %}
<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="{{ url_for('home') }}">
            <img src="{{ url_for('static', filename='img/logo-mark.png') }}" alt="">
            <span>Jobsite</span>
        </a>
        <div class="topbar-right">
            <a class="topbar-link" href="{{ url_for('history') }}">History</a>
            <span class="who">{{ session['username'] }}</span>
            <a class="topbar-link" href="{{ url_for('logout') }}">Log out</a>
        </div>
    </div>
</header>

<main class="container">
    {% for message in get_flashed_messages() %}
        <div class="alert">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
</main>
{% endblock %}
