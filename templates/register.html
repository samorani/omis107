{% extends "base.html" %}
{% from "_password_field.html" import password_field %}

{% block title %}Register{% endblock %}

{% block content %}
    <h1>Create an account</h1>
    <p class="subtitle">It only takes a moment.</p>

    <form method="POST">
        <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Pick a username"
                   autocomplete="username" required autofocus>
        </div>

        {{ password_field('password', 'Password', 'password') }}

        <button type="submit">Register</button>
    </form>

    <p class="foot">Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
{% endblock %}
